name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # يعمل يوميًا عند منتصف الليل UTC
  workflow_dispatch:        # يسمح بالتشغيل اليدوي من تبويب Actions
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake Contribution Grid
        uses: Platane/snk@v3
        with:
          github_user_name: 17mcjoker38
          outputs: |
            assets/images/snake-dark.svg?palette=github-dark
            assets/images/snake-light.svg?palette=github-light

      - name: Push generated files to repository
        uses: crazy-max/ghaction-github-pages@v4
        if: false   # اختياري - يمكن استبداله بخطوة commit مباشرة أدناه
        with:
          target_branch: output

      - name: Commit and push snake files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/images/snake-dark.svg assets/images/snake-light.svg
          git commit -m "chore: update snake animation" || echo "No changes to commit"
          git push
